# Builds the macOS app (DMGs for Apple Silicon and Intel) on every push and
# publishes them to the rolling "mac-latest" GitHub release.
# The app is ad-hoc signed (no paid Apple Developer certificate), so macOS
# asks for confirmation on first launch: right-click the app → Open, or
# System Settings → Privacy & Security → Open Anyway.
name: macOS app

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build web app
        run: npm run build

      # One architecture at a time: building DMGs in parallel makes hdiutil
      # fail to detach images on GitHub's macOS runners. Retries cover the
      # remaining occasional "resource busy" flakes.
      - name: Build DMGs (arm64, then x64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          for arch in arm64 x64; do
            for attempt in 1 2 3; do
              if npx electron-builder --mac dmg --$arch --publish never; then break; fi
              if [ "$attempt" = 3 ]; then echo "DMG build failed for $arch"; exit 1; fi
              echo "Retrying $arch build (attempt $((attempt + 1)))"; sleep 10
            done
          done
          ls -la dist-desktop/*.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: TheCodeMaker-macOS
          path: dist-desktop/*.dmg
          if-no-files-found: error

      - name: Publish to the mac-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mac-latest
          name: The Code Maker for macOS (latest build)
          prerelease: true
          make_latest: false
          body: |
            Easiest install (no "damaged" warning): open Terminal and run
                curl -fsSL https://raw.githubusercontent.com/Death7310/The-Code-Maker/main/scripts/install-mac.sh | bash
            It picks the right version for your Mac, installs it to Applications and opens it.

            Or download the DMG for your Mac:
            - TheCodeMaker-mac-arm64.dmg: Apple Silicon (M1, M2, M3, M4…)
            - TheCodeMaker-mac-x64.dmg: Intel Macs
            If macOS says the app is "damaged" after a browser download, run this once in Terminal:
                xattr -cr "/Applications/The Code Maker.app"
            (Browsers tag downloads; the app is ad-hoc signed, not notarized by Apple.)
            Built from ${{ github.ref_name }} @ ${{ github.sha }}.
          files: dist-desktop/*.dmg
