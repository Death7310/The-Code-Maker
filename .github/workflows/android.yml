# Builds the Android APK on every push. Download it from the run's "Artifacts"
# section. Every push to main also publishes a GitHub Release with the APK
# attached (Releases page → newest "build-N"), as does pushing a tag like v1.0.0.
name: Android APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed only to attach the APK to a release on tag pushes

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build web app and sync into Android project
        run: |
          npm run build
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk TheCodeMaker-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TheCodeMaker-apk
          path: TheCodeMaker-debug.apk
          if-no-files-found: error

      - name: Attach APK to release (version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TheCodeMaker-debug.apk

      - name: Publish release with APK (pushes to main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: The Code Maker (build ${{ github.run_number }})
          body: |
            Android APK for sideloading (debug-signed). On your phone: download
            TheCodeMaker-debug.apk, open it, and allow installs from this source when asked.
            Built from ${{ github.sha }}.
          make_latest: true
          files: TheCodeMaker-debug.apk
